[package]
name = "closedport"
version = "0.3.0"
description = "Port, process and system utility"
authors = ["ClosedPort"]
license = "MIT"
edition = "2021"

[lib]
name = "closedport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.8"
encoding_rs = "0.8"
parking_lot = "0.12"
ureq = { version = "3.4.1", features = ["json"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
